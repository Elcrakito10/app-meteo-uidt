name: app_meteo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Typographie (Poppins + Inter)
  google_fonts: ^6.2.1

  # Gestion d'état
  flutter_riverpod: ^2.5.1

  # Réseau : appels API météo
  dio: ^5.5.0+1
  retrofit: '>=4.9.0 <4.10.0'
  json_annotation: ^4.12.0

  # Configuration / clés API protégées
  flutter_dotenv: ^5.1.0

  # Carte
  google_maps_flutter: ^2.9.0

  # Géolocalisation utilisateur (écran Carte météo)
  geolocator: ^13.0.1
  geocoding: ^5.0.0

  # Vérification connexion réseau
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Génération de code (modèles JSON — voir README pour le client Retrofit)
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/backgrounds/
    - assets/icons/